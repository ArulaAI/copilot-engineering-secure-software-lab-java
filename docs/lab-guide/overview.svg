<svg xmlns="http://www.w3.org/2000/svg" width="960" height="502" viewBox="0 0 960 502" role="img" aria-label="The five stages of the secure software lab"><title>The five stages of the secure software lab</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3AF"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="500.5" rx="16" fill="#FFFFFF" stroke="#E3E6EB" stroke-width="1.5"/><text x="32" y="40" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#315F9E" text-anchor="start">Secure software lab · the whole journey</text><text x="32" y="67" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#27292D" text-anchor="start">Five stages. Each answers one question and hands a report to the next.</text><text x="32" y="90" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5E646E" text-anchor="start">Copilot does the reading and the typing. You check the evidence and make each decision.</text><text x="32" y="128" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#27292D" text-anchor="start" letter-spacing="0.8">UNDERSTAND</text><rect x="32" y="136" width="351" height="3" rx="1.5" fill="#27292D" stroke="#27292D" stroke-width="0"/><text x="402" y="128" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#315F9E" text-anchor="start" letter-spacing="0.8">DECIDE</text><rect x="402" y="136" width="166" height="3" rx="1.5" fill="#315F9E" stroke="#315F9E" stroke-width="0"/><text x="587" y="128" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-