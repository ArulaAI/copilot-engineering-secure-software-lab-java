<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img" aria-label="Secure software lab"><title>Secure software lab</title><rect width="1200" height="290" fill="#0b1724"/><g font-family="Arial, sans-serif"><text x="20" y="45" fill="white" font-size="26">Secure software lab</text><rect x="20" y="90" width="218" height="120" rx="12" fill="#17354a"/><text x="32" y="125" fill="white" font-size="20">Map</text><text x="32" y="160" fill="#cbd5e1" font-size="12">Actual source and boundaries</text><rect x="256" y="90" width="218" height="120" rx="12" fill="#17354a"/><text x="268" y="125" fill="white" font-size="20">Investigate</text><text x="268" y="160" fill="#cbd5e1" font-size="12">Evidence and uncertainty</text><rect x="492" y="90" width="218" height="120" rx="12" fill="#17354a"/><text x="504" y="125" fill="white" font-size="20">Prioritize</text><text x="504" y="160" fill="#cbd5e1" font-size="12">STRIDE, blast radius, top five</text><rect x="728" y="90" width="218" height="120" rx="12" fill="#17354a"/><text x="740" y="125" fill="white" font-size="20">Create / critique</text><text x="740" y="160" fill="#cbd5e1" font-size="12">One verified task at a time</text><rect x="964" y="90" width="218" height="120" rx="12" fill="#17354a"/><text x="976" y="125" fill="white" font-size="20">Close out</text><text x="976" y="160" fill="#cbd5e1" font-size="12">Current findings and residual risk</text><text x="20" y="255" fill="#cbd5e1" font-size="17">No approval forms; use /hand-off when needed. The facilitator chooses the live task count.</text></g></svg>
