<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img" aria-label="Create and critique, then cumulative review"><title>Create and critique, then cumulative review</title><rect width="1200" height="290" fill="#0b1724"/><g font-family="Arial, sans-serif"><text x="20" y="45" fill="white" font-size="26">Create and critique, then cumulative review</text><rect x="20" y="90" width="218" height="120" rx="12" fill="#17354a"/><text x="32" y="125" fill="white" font-size="20">Select task</text><text x="32" y="160" fill="#cbd5e1" font-size="12">Agree scope and criteria</text><rect x="256" y="90" width="218" height="120" rx="12" fill="#17354a"/><text x="268" y="125" fill="white" font-size="20">Create</text><text x="268" y="160" fill="#cbd5e1" font-size="12">Persist cycle before editing</text><rect x="492" y="90" width="218" height="120" rx="12" fill="#17354a"/><text x="504" y="125" fill="white" font-size="20">Critique</text><text x="504" y="160" fill="#cbd5e1" font-size="12">Fresh reviewer runs checks</text><rect x="728" y="90" width="218" height="120" rx="12" fill="#17354a"/><text x="740" y="125" fill="white" font-size="20">Repeat if needed</text><text x="740" y="160" fill="#cbd5e1" font-size="12">Maximum three cycles per task</text><rect x="964" y="90" width="218" height="120" rx="12" fill="#17354a"/><text x="976" y="125" fill="white" font-size="20">Final review</text><text x="976" y="160" fill="#cbd5e1" font-size="12">All changes and open findings</text><text x="20" y="255" fill="#cbd5e1" font-size="17">End each stage with a human gate and separate /hand-off. The facilitator chooses the live task count.</text></g></svg>
