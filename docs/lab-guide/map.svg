<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="How map-codebase uses one subagent per package"><title>How map-codebase uses one subagent per package</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3AF"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="468.5" rx="16" fill="#FFFFFF" stroke="#E3E6EB" stroke-width="1.5"/><text x="32" y="40" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#315F9E" text-anchor="start">Stage 1A · how /map-codebase works</text><text x="32" y="67" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#27292D" text-anchor="start">One helper per package, so your chat holds summaries, not every file.</text><text x="32" y="90" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5E646E" text-anchor="start">Each Package Explorer is a subagent: it reads one package in its own context and returns a short summary.</text><rect x="32" y="200" width="200" height="96" rx="12" fill="#EEF4FB" stroke="#315F9E" stroke-width="1.3"/><text x="48" y="234" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#27292D" text-anchor="start">Codebase Mapper</text><text x="48" y="256" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">the agent you pick</text><rect x="48" y="266" width="99.36" height="20" rx="5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="54" y="280" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="600" fill="#27292D" text-anchor="start">/map-codebase</text><rect x="330" y="124" width="236" height="58" rx="10" fill="#FFFFFF" stroke="#D9DCE1" stroke-width="1.3" stroke-dasharray="5 4"/><text x="344" y="148" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#27292D" text-anchor="start">Package Explorer</text><rect x="344" y="156" width="32.16" height="20" rx="5" fill="#F6F6F7" stroke="#F6F6F7" stroke-width="0"/><text x="350" y="170" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="600" fill="#27292D" text-anchor="start">api</text><text x="552" y="170" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#5E646E" text-anchor="end">own context</text><path d="M234,248 C282,248 280,153.0 326,153.0" stroke="#9AA3AF" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="330" y="202" width="236" height="58" rx="10" fill="#FFFFFF" stroke="#D9DCE1" stroke-width="1.3" stroke-dasharray="5 4"/><text x="344" y="226" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#27292D" text-anchor="start">Package Explorer</text><rect x="344" y="234" width="38.879999999999995" height="20" rx="5" fill="#F6F6F7" stroke="#F6F6F7" stroke-width="0"/><text x="350" y="248" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="600" fill="#27292D" text-anchor="start">auth</text><text x="552" y="248" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#5E646E" text-anchor="end">own context</text><path d="M234,248 C282,248 280,231.0 326,231.0" stroke="#9AA3AF" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="330" y="280" width="236" height="58" rx="10" fill="#FFFFFF" stroke="#D9DCE1" stroke-width="1.3" stroke-dasharray="5 4"/><text x="344" y="304" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#27292D" text-anchor="start">Package Explorer</text><rect x="344" y="312" width="38.879999999999995" height="20" rx="5" fill="#F6F6F7" stroke="#F6F6F7" stroke-width="0"/><text x="350" y="326" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="600" fill="#27292D" text-anchor="start">data</text><text x="552" y="326" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#5E646E" text-anchor="end">own context</text><path d="M234,248 C282,248 280,309.0 326,309.0" stroke="#9AA3AF" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="330" y="358" width="236" height="58" rx="10" fill="#FFFFFF" stroke="#D9DCE1" stroke-width="1.3" stroke-dasharray="5 4"/><text x="344" y="382" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#27292D" text-anchor="start">Package Explorer</text><rect x="344" y="390" width="59.04" height="20" rx="5" fill="#F6F6F7" stroke="#F6F6F7" stroke-width="0"/><text x="350" y="404" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="600" fill="#27292D" text-anchor="start">session</text><text x="552" y="404" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#5E646E" text-anchor="end">own context</text><path d="M234,248 C282,248 280,387.0 326,387.0" stroke="#9AA3AF" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M568,153.0 C620,153.0 610,210 646,210" stroke="#9AA3AF" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M568,231.0 C620,231.0 610,270 646,270" stroke="#9AA3AF" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M568,309.0 C620,309.0 610,290 646,290" stroke="#9AA3AF" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M568,387.0 C620,387.0 610,310 646,310" stroke="#9AA3AF" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="650" y="170" width="278" height="170" rx="12" fill="#FFFFFF" stroke="#D9DCE1" stroke-width="1.3"/><text x="666" y="198" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#5E646E" text-anchor="start" letter-spacing="0.6">WRITES</text><rect x="666" y="206" width="166.56" height="20" rx="5" fill="#EEF4FB" stroke="#EEF4FB" stroke-width="0"/><text x="672" y="220" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="600" fill="#315F9E" text-anchor="start">outputs/codebase-map.md</text><circle cx="672" cy="246" r="2.6" fill="#315F9E"/><text x="682" y="250" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#27292D" text-anchor="start">Index of packages and classes</text><circle cx="672" cy="264" r="2.6" fill="#315F9E"/><text x="682" y="268" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#27292D" text-anchor="start">Entry points and their inputs</text><circle cx="672" cy="282" r="2.6" fill="#315F9E"/><text x="682" y="286" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#27292D" text-anchor="start">Data stores and external calls</text><circle cx="672" cy="300" r="2.6" fill="#315F9E"/><text x="682" y="304" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#27292D" text-anchor="start">Trust boundaries</text><circle cx="672" cy="318" r="2.6" fill="#315F9E"/><text x="682" y="322" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#27292D" text-anchor="start">Architecture diagram</text><text x="32" y="446" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">No judgments yet: mapping comes before analysis. If subagents are blocked, the Mapper reads each package itself, one at a time.</text></svg>