<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-label="Single codebase mapper"><title>Single codebase mapper</title><rect width="1000" height="260" fill="#0b1724"/><g font-family="Arial, sans-serif" fill="white"><text x="25" y="45" font-size="26">Stage 1A: one mapper, source-grounded evidence</text><text x="25" y="100" font-size="20">Inventory Java packages and files</text><text x="25" y="140" font-size="20">Read source, launcher, dependencies and configuration</text><text x="25" y="180" font-size="20">Trace actual connections and retain citations</text><text x="25" y="225" font-size="20">Write codebase-map.md, inspect the gate, then run /hand-off</text></g></svg>
